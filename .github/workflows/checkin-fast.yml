name: GLaDOS Checkin (Fast)

# 快速验证代码改动: 与 GLaDOS  Checkin 完全一致, 但没有启动前的 30 分钟随机等待和失败重试,
# 用于手动触发后尽快看到结果(脚本内仍保留每账号 challenge 随机等待与账号间隔)。
# 注意: 签到/兑换都是真实操作, 会真实扣分。
on:
  workflow_dispatch:  # 仅手动触发, 不参与定时调度

jobs:
  checkin:
    runs-on: ubuntu-latest
    # 多账号有随机间隔(默认 8~35s/账号) + 每账号随机等待(2.8~9s), 留足余量
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Checkin
        run: python checkin.py
        timeout-minutes: 25
        env:
          GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GLADOS_DOMAIN: ${{ vars.GLADOS_DOMAIN }}
          GLADOS_PLANS: ${{ secrets.GLADOS_PLANS }}
          GLADOS_DEBUG: ${{ vars.GLADOS_DEBUG }}
